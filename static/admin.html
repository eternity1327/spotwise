<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Spotwise admin</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 16px;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font: inherit;
    }

    button {
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button.primary {
      background: #0f766e;
      border-color: #0f766e;
      color: white;
    }

    button.danger {
      background: #dc2626;
      border-color: #dc2626;
      color: white;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
    }

    li img,
    li .empty-photo {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      border-radius: 10px;
      object-fit: cover;
      background: #e2e8f0;
    }

    li .info {
      flex: 1;
      min-width: 0;
    }

    li small {
      display: block;
      color: #64748b;
    }

    .flagged {
      color: #dc2626;
      font-weight: 700;
    }

    #status {
      color: #64748b;
    }
  </style>
</head>
<body>
  <main>
    <h1>Spotwise admin</h1>
    <form id="login">
      <input id="key" type="password" placeholder="Admin key" autocomplete="current-password" required>
      <button class="primary">Load spots</button>
    </form>
    <p id="status"></p>
    <ul id="spots"></ul>
  </main>
  <script src="admin.js"></script>
</body>
</html>
